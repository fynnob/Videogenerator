name: Generate Reddit Video

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  make-video:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Download latest release chunks via curl ──
      - name: Download chunks from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p chunks

          # Get latest release data
          RELEASE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          echo "Latest release: $(echo $RELEASE | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")"

          # Extract download URLs for chunk_*.mp4 files and download each
          echo "$RELEASE" | python3 - << 'PYEOF'
          import sys, json, subprocess, os

          release = json.load(sys.stdin)
          assets  = release.get("assets", [])
          chunks  = [a for a in assets if a["name"].startswith("chunk_") and a["name"].endswith(".mp4")]

          if not chunks:
              print("ERROR: No chunk_*.mp4 files found in latest release!")
              sys.exit(1)

          print(f"Found {len(chunks)} chunk(s)")
          token = os.environ["GH_TOKEN"]

          for asset in sorted(chunks, key=lambda a: a["name"]):
              url  = asset["url"]
              name = asset["name"]
              print(f"Downloading {name}...")
              subprocess.run([
                  "curl", "-L", "-s",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Accept: application/octet-stream",
                  "-o", f"chunks/{name}",
                  url
              ], check=True)
              size = os.path.getsize(f"chunks/{name}") / 1024 / 1024
              print(f"  Saved chunks/{name} ({size:.1f} MB)")
          PYEOF

      # ── 3. Python setup ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install edge-tts

      # ── 4. Fetch best Reddit post ──
      - name: Fetch Reddit post
        run: python scripts/fetch_post.py

      # ── 5. Generate TTS audio + subtitles ──
      - name: Generate TTS + captions
        run: python scripts/generate_tts.py

      # ── 6. Render final video with ffmpeg ──
      - name: Render video
        run: python scripts/render_video.py

      # ── 7. Mark post as seen and commit back ──
      - name: Update seen_posts.json
        run: python scripts/update_seen.py

      - name: Commit seen_posts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --staged --quiet || git commit -m "chore: mark post as seen [skip ci]"
          git push

      # ── 8. Upload output.mp4 as artifact (for testing) ──
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: reddit-video-${{ github.run_number }}
          path: output.mp4
          retention-days: 7
