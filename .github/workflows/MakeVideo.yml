name: Generate Reddit Video

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  make-video:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo (includes seen_posts.json and video chunks) ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python setup ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install praw edge-tts

      # ── 3. Fetch best Reddit post ──
      - name: Fetch Reddit post
        env:
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/fetch_post.py

      # ── 4. Generate TTS audio + subtitles ──
      - name: Generate TTS + captions
        run: python scripts/generate_tts.py

      # ── 5. Render final video with ffmpeg ──
      #    (ffmpeg is pre-installed on ubuntu-latest runners)
      - name: Render video
        run: python scripts/render_video.py

      # ── 6. Mark post as seen and commit back ──
      - name: Update seen_posts.json
        run: python scripts/update_seen.py

      - name: Commit seen_posts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --staged --quiet || git commit -m "chore: mark post as seen [skip ci]"
          git push

      # ── 7. Upload output.mp4 as artifact (for testing) ──
      #    Replace this step later with your YouTube upload script
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: reddit-video-${{ github.run_number }}
          path: output.mp4
          retention-days: 7
          
