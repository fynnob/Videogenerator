name: Generate Reddit Video

on:
  # This allows cron-job.org to trigger the high-compute job
  repository_dispatch:
    types: [manual-cron-trigger]

  # This keeps your "Run workflow" button in the GitHub UI
  workflow_dispatch:

jobs:
  make-video:
    runs-on: ubuntu-latest

    # It's good practice to explicitly grant write permissions so your bot can commit the seen_posts.json file
    permissions:
      contents: write

    steps:
      # ── 1. Checkout repo ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Download latest release chunks via curl ──
      - name: Download chunks from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p chunks

          # Save release JSON to a file so Python can read it cleanly
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            -o release.json

          echo "Latest release: $(python3 -c "import json; d=json.load(open('release.json')); print(d['tag_name'])")"

          # Download each chunk_*.mp4 asset
          python3 << 'PYEOF'
          import json, subprocess, os, sys

          with open("release.json") as f:
              release = json.load(f)

          assets = release.get("assets", [])
          chunks = [a for a in assets if a["name"].startswith("chunk_") and a["name"].endswith(".mp4")]

          if not chunks:
              print("ERROR: No chunk_*.mp4 files found in latest release!")
              sys.exit(1)

          print(f"Found {len(chunks)} chunk(s)")
          token = os.environ["GH_TOKEN"]

          for asset in sorted(chunks, key=lambda a: a["name"]):
              url  = asset["url"]
              name = asset["name"]
              print(f"Downloading {name}...")
              subprocess.run([
                  "curl", "-L", "-s",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Accept: application/octet-stream",
                  "-o", f"chunks/{name}",
                  url
              ], check=True)
              size = os.path.getsize(f"chunks/{name}") / 1024 / 1024
              print(f"  Saved chunks/{name} ({size:.1f} MB)")
          PYEOF

      # ── 3. Python setup ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Fetch best Reddit post ──
      - name: Fetch Reddit post
        run: python scripts/fetch_post.py

      # ── 5. Generate TTS audio + subtitles ──
      - name: Generate TTS + captions
        run: python scripts/generate_tts.py

      # ── 5.5 Download fonts ──
      - name: Download Fonts
        run: python scripts/get_fonts.py

      # ── 6. Setup FFmpeg ──
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        
      # ── 7. Render final video with ffmpeg ──
      - name: Render video
        run: python scripts/render_video.py

      # ── 8. Mark post as seen and commit back ──
      - name: Update seen_posts.json
        run: python scripts/update_seen.py

      - name: Commit seen_posts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --staged --quiet || git commit -m "chore: mark post as seen [skip ci]"
          git push

      # ── 9. Upload output.mp4 to youtube ──
      - name: Upload to YouTube
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python scripts/upload_yt.py
